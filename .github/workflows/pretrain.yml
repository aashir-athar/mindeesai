name: Weekly retrain (small variant, R2 → HF)

# Runs the Python pretraining script on a GitHub-hosted CPU runner every
# week. Free for public repos (2000 min/month on ubuntu-latest; a small
# 2000-step run finishes in ~30-60 minutes, so we use <4 hours/month).
#
# Triggers:
#   - workflow_dispatch (manual via Actions tab, with variant/steps inputs)
#   - schedule: every Sunday at 03:00 UTC (the "weekly self-learning tick")
#
# Data flow:
#   1. Fetches the latest distill-corpus.jsonl + distill-feedback.jsonl
#      from Cloudflare R2 (where the running Vercel app writes them).
#   2. Trains the `small` variant on CPU for ~2000 steps (~50M params,
#      ~30-60 min). This is INTENTIONALLY tiny — its purpose is to keep
#      the self-learning data pipeline exercised, not to compete with
#      the user's local-GPU home-11gb training.
#   3. Pushes the resulting checkpoint to HuggingFace Hub as a SIDE
#      REVISION (`small-weekly` branch of aashir-athar/mindeesai-base).
#      This way it never overwrites the canonical `main` revision that
#      holds the user's local-trained home-11gb checkpoint.
#
# Secrets required (Settings → Secrets and variables → Actions):
#   R2_ACCOUNT_ID         — Cloudflare account ID
#   R2_BUCKET             — R2 bucket name
#   R2_ACCESS_KEY_ID      — R2 API access key
#   R2_SECRET_ACCESS_KEY  — R2 API secret
#   HF_TOKEN              — HuggingFace write-scoped token
#
# If any R2_* is missing, the workflow falls back to training on the seed
# corpus + dialogue dataset only — never crashes the run.
# If HF_TOKEN is missing, the workflow still uploads the GH Actions
# artifact (downloadable from the run page) so you can pull manually.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Model variant (nano | small)'
        required: false
        default: 'small'
        type: choice
        options: [nano, small]
      steps:
        description: 'Training steps'
        required: false
        default: '2000'
      batch:
        description: 'Batch size'
        required: false
        default: '4'
      hf_dataset:
        description: 'Optional HuggingFace dataset (e.g. roneneldan/TinyStories). Empty to skip.'
        required: false
        default: 'roneneldan/TinyStories'
      hf_max_tokens:
        description: 'Cap on tokens streamed from HF (RAM bound)'
        required: false
        default: '500000'
      dialogue_dataset:
        description: 'HF dialogue dataset (databricks/databricks-dolly-15k | HuggingFaceH4/ultrachat_200k | empty)'
        required: false
        default: 'databricks/databricks-dolly-15k'
      mix_config:
        description: 'Optional --mix-config path (e.g. scripts/data/mix-broadbrain.json). Empty for simple two-dataset mix.'
        required: false
        default: ''
  schedule:
    # Sundays at 03:00 UTC. GitHub may delay scheduled runs by up to ~30 min.
    - cron: '0 3 * * 0'

env:
  HF_REPO: aashir-athar/mindeesai-base
  HF_REVISION: small-weekly

jobs:
  pretrain:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # cap below the 360-minute hard limit
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install training deps (CPU-only torch + R2/HF clients)
        run: |
          python -m pip install --upgrade pip
          # CPU wheel of torch — avoids GPU build sizes
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r scripts/train/requirements.txt
          pip install boto3 huggingface_hub

      - name: Ensure corpus exists
        run: ls -lh scripts/data/corpus.txt

      # Pull the latest distill-corpus.jsonl from Cloudflare R2. The
      # running Vercel app's persistence layer writes there after every
      # chat turn and every cron tick. Without this step the training
      # would run only on the seed corpus and never see real chat data.
      - name: Fetch distill corpus from Cloudflare R2
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET:            ${{ secrets.R2_BUCKET }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p data
          python - <<'PY'
          import os, sys
          acct = os.environ.get("R2_ACCOUNT_ID", "")
          bucket = os.environ.get("R2_BUCKET", "")
          ak = os.environ.get("R2_ACCESS_KEY_ID", "")
          sk = os.environ.get("R2_SECRET_ACCESS_KEY", "")
          if not (acct and bucket and ak and sk):
              print("✗ R2 secrets missing — training will use seed + dialogue corpora only.")
              print("  Set R2_ACCOUNT_ID / R2_BUCKET / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY")
              print("  in Settings → Secrets and variables → Actions.")
              sys.exit(0)

          try:
              import boto3
              from botocore.config import Config as BotoConfig
          except ImportError as e:
              print(f"✗ boto3 unavailable: {e}"); sys.exit(0)

          s3 = boto3.client(
              "s3",
              endpoint_url=f"https://{acct}.r2.cloudflarestorage.com",
              aws_access_key_id=ak,
              aws_secret_access_key=sk,
              region_name="auto",
              config=BotoConfig(signature_version="s3v4"),
          )

          # First, list what's actually under data/ so the log shows the
          # store state if something is missing.
          try:
              resp = s3.list_objects_v2(Bucket=bucket, Prefix="data/", MaxKeys=20)
          except Exception as e:
              print(f"✗ R2 LIST failed: {e}")
              print(f"  check that R2_ACCESS_KEY_ID has Read+Write scope on {bucket}")
              sys.exit(0)
          contents = resp.get("Contents", [])
          print(f"✓ R2 list ok: {len(contents)} object(s) under data/ in {bucket}")
          for it in contents[:10]:
              print(f"  - {it['Key']} ({it['Size']} bytes)")

          def _pull(key, dest):
              try:
                  s3.download_file(bucket, key, dest)
                  return os.path.getsize(dest)
              except Exception as e:
                  print(f"  ✗ download {key} failed: {e}")
                  return 0

          # data/distill-corpus.jsonl is the chat-turn-by-chat-turn training
          # signal. If it's missing here, either no chat happened yet, or
          # the deployed app isn't in cloudflare-r2 mode.
          keys_here = {it["Key"] for it in contents}
          if "data/distill-corpus.jsonl" not in keys_here:
              print()
              print("✗ data/distill-corpus.jsonl not in R2.")
              print("  Two possible reasons:")
              print("    1. No chat turns have happened yet on the deployed Vercel app.")
              print("    2. MEMORY_PERSISTENCE on Vercel is not 'cloudflare-r2'")
              print("       (auto-detects when R2_* env vars are present + MEMORY_PERSISTENCE unset).")
              print("  Training will proceed on seed + dialogue corpora only.")
              sys.exit(0)
          sz = _pull("data/distill-corpus.jsonl", "data/distill-corpus.jsonl")
          if sz:
              print(f"✓ fetched distill-corpus.jsonl ({sz:,} bytes)")

          # Optional 👍/👎 RLHF-lite filter file.
          if "data/distill-feedback.jsonl" in keys_here:
              fsz = _pull("data/distill-feedback.jsonl", "data/distill-feedback.jsonl")
              if fsz:
                  print(f"✓ fetched distill-feedback.jsonl ({fsz:,} bytes) — RLHF-lite filtering active")
          else:
              print("· no distill-feedback.jsonl yet (no thumbs given) — all rows weighted equally")
          PY

      - name: Train BPE tokenizer (if missing)
        run: |
          if [ ! -s tokenizer/tokenizer.json ]; then
            python scripts/train/tokenizer_train.py \
              --corpus scripts/data/corpus.txt \
              --vocab-size 8000 \
              --out tokenizer/tokenizer.json
          fi

      - name: Pretrain
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: '1'
          MIND_VARIANT: ${{ github.event.inputs.variant || 'small' }}
        run: |
          VARIANT="${{ github.event.inputs.variant || 'small' }}"
          STEPS="${{ github.event.inputs.steps || '2000' }}"
          BATCH="${{ github.event.inputs.batch || '4' }}"
          mkdir -p checkpoints data
          HF_ARGS=""
          HF_DS="${{ github.event.inputs.hf_dataset || 'roneneldan/TinyStories' }}"
          HF_MAX="${{ github.event.inputs.hf_max_tokens || '500000' }}"
          if [ -n "$HF_DS" ]; then
            HF_ARGS="--hf-dataset $HF_DS --hf-max-tokens $HF_MAX --hf-weight 2.0"
          fi
          DIALOGUE_ARGS=""
          DIALOGUE_DS="${{ github.event.inputs.dialogue_dataset || 'databricks/databricks-dolly-15k' }}"
          if [ -n "$DIALOGUE_DS" ]; then
            DIALOGUE_ARGS="--dialogue-dataset $DIALOGUE_DS --dialogue-weight 3.0 --dialogue-max-tokens 1500000"
          fi
          DISTILL_ARGS=""
          if [ -s data/distill-corpus.jsonl ]; then
            DISTILL_ARGS="--distill-corpus data/distill-corpus.jsonl"
          fi
          MIX_ARGS=""
          MIX_CFG="${{ github.event.inputs.mix_config || '' }}"
          if [ -n "$MIX_CFG" ] && [ -f "$MIX_CFG" ]; then
            MIX_ARGS="--mix-config $MIX_CFG"
          fi
          python scripts/train/pretrain.py \
            --variant "$VARIANT" \
            --corpus scripts/data/corpus.txt \
            --tokenizer tokenizer/tokenizer.json \
            --steps "$STEPS" \
            --batch "$BATCH" \
            --grad-accum 1 \
            --lr 3e-4 \
            --warmup 100 \
            --val-frac 0.05 \
            --val-every 200 \
            --ckpt-every 500 \
            --base-weight 1.0 \
            --distill-weight 4.0 \
            --completion-only-loss 1 \
            --persona-loss-weight 0.05 \
            $DISTILL_ARGS \
            $HF_ARGS \
            $DIALOGUE_ARGS \
            $MIX_ARGS \
            --log data/training-metrics.jsonl \
            --out checkpoints/base.bin \
            --torch-ckpt checkpoints/torch-resume.pt

      - name: Show training summary
        run: |
          echo "--- Last 10 training-log lines ---"
          tail -n 10 data/training-metrics.jsonl || true
          echo ""
          echo "--- Checkpoint size ---"
          ls -lh checkpoints/ || true
          echo ""
          # Sanity check — abort the upload if the checkpoint is suspiciously small
          # (probably training crashed early and left a stub file).
          SIZE=$(stat -c%s checkpoints/base.bin 2>/dev/null || echo 0)
          if [ "$SIZE" -lt 1000000 ]; then
            echo "::error::checkpoint suspiciously small ($SIZE bytes) — refusing to push to HF"
            exit 1
          fi
          echo "✓ checkpoint size sanity check passed ($SIZE bytes)"

      # Always upload the GH Actions artifact — downloadable from the run
      # page for 30 days, useful as a fallback if the HF push fails or you
      # want to inspect the exact bytes the workflow produced.
      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindees-checkpoint-${{ github.run_number }}
          path: |
            checkpoints/base.bin
            tokenizer/tokenizer.json
            data/training-metrics.jsonl
          retention-days: 30
          if-no-files-found: error

      # Push the trained checkpoint to a SIDE REVISION of the HF repo so
      # it never overwrites the canonical `main` revision (which holds
      # the local-GPU home-11gb checkpoint). To activate this small model
      # in production, set HF_MODEL_REVISION=small-weekly on Vercel.
      # No `if:` gating — the Python script below checks $HF_TOKEN at
      # runtime and exits cleanly with a friendly message if it's empty
      # (GH Actions doesn't allow secrets.* in if expressions, only env.*).
      - name: Push checkpoint to HuggingFace Hub (side revision)
        env:
          HF_TOKEN:    ${{ secrets.HF_TOKEN }}
          HF_REPO:     ${{ env.HF_REPO }}
          HF_REVISION: ${{ env.HF_REVISION }}
        run: |
          python - <<'PY'
          import os, sys
          token = os.environ.get("HF_TOKEN", "")
          if not token:
              print("· no HF_TOKEN secret — skipping HF push (artifact still available above)")
              sys.exit(0)
          try:
              from huggingface_hub import HfApi, create_repo, create_branch
          except ImportError as e:
              print(f"✗ huggingface_hub unavailable: {e}"); sys.exit(0)

          repo_id = os.environ.get("HF_REPO", "aashir-athar/mindeesai-base")
          revision = os.environ.get("HF_REVISION", "small-weekly")
          api = HfApi(token=token)

          # Make sure repo + branch exist (idempotent — exist_ok=True).
          try:
              create_repo(repo_id, repo_type="model", exist_ok=True, private=False, token=token)
          except Exception as e:
              print(f"✗ repo verify failed: {e}"); sys.exit(0)
          try:
              create_branch(repo_id, branch=revision, exist_ok=True, token=token)
          except Exception as e:
              print(f"· create_branch warning (often fine if branch already exists): {e}")

          targets = [
              ("checkpoints/base.bin",         "base.bin"),
              ("tokenizer/tokenizer.json",     "tokenizer.json"),
              ("data/training-metrics.jsonl",  "training-metrics.jsonl"),
          ]
          uploaded = 0
          for local, in_repo in targets:
              if not os.path.exists(local):
                  print(f"  skip {local} — missing"); continue
              try:
                  api.upload_file(
                      path_or_fileobj=local,
                      path_in_repo=in_repo,
                      repo_id=repo_id,
                      revision=revision,
                      commit_message=f"weekly retrain run #{os.environ.get('GITHUB_RUN_NUMBER','?')}",
                  )
                  print(f"  ✓ uploaded {local} → {repo_id}@{revision}:{in_repo}")
                  uploaded += 1
              except Exception as e:
                  print(f"  ✗ upload {local} failed: {e}")
          print()
          print(f"uploaded {uploaded}/{len(targets)} files to {repo_id}@{revision}")
          print(f"to activate this checkpoint on Vercel, set HF_MODEL_REVISION={revision}")
          PY
