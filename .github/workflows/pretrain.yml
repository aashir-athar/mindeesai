name: Pretrain MindeesAI (nano)

# Runs the Python pretraining script on a GitHub-hosted CPU runner.
# Free for public repos (2000 minutes/month on the standard `ubuntu-latest`).
#
# Triggers:
#   - Manually from the Actions tab (workflow_dispatch)
#   - Automatically on any push to a `train/*` branch
#   - On a weekly schedule (Sundays at 03:00 UTC) so the model keeps
#     accumulating training over time without anyone clicking anything
#
# Output:
#   - tokenizer/tokenizer.json    (BPE trained on the corpus)
#   - checkpoints/base.bin        (TS-loadable native model checkpoint)
#   - both uploaded as workflow artifacts; can be downloaded + committed
#     back to the repo, or pushed to Vercel Blob via the helper script.
#
# CPU-only training of the `nano` variant: ~12M params, ~2000 steps, ~30min.
# Won't beat Groq, but the checkpoint is REAL — not random init — and
# loading it into the TS runtime exercises the full pipeline end-to-end.

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'Model variant (nano | small)'
        required: false
        default: 'small'
        type: choice
        options: [nano, small]
      steps:
        description: 'Training steps'
        required: false
        default: '2000'
      batch:
        description: 'Batch size'
        required: false
        default: '4'
      hf_dataset:
        description: 'Optional HuggingFace dataset for streaming augmentation (e.g. roneneldan/TinyStories)'
        required: false
        default: ''
      hf_max_tokens:
        description: 'Cap on tokens streamed from HF (RAM bound)'
        required: false
        default: '500000'
  push:
    branches:
      - 'train/**'
  schedule:
    # Sundays 03:00 UTC. GitHub may delay scheduled runs by up to ~30 min.
    - cron: '0 3 * * 0'

jobs:
  pretrain:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # cap below the 360-minute hard limit
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install training deps (CPU-only torch)
        run: |
          python -m pip install --upgrade pip
          # CPU wheel of torch — avoids GPU build sizes
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install -r scripts/train/requirements.txt

      - name: Ensure corpus exists
        run: ls -lh scripts/data/corpus.txt

      # Pull the live distillation corpus from Vercel Blob if present.
      # The running app appends every chat turn to data/distill-corpus.jsonl
      # and flushes it to Blob after each turn + after every cron tick. We
      # want the LATEST version as training signal here. Best-effort:
      # missing blob / missing token → training falls back to the seed
      # corpus only, no failure.
      - name: Fetch distillation corpus from Vercel Blob
        env:
          BLOB_RW_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          mkdir -p data
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          token = os.environ.get("BLOB_RW_TOKEN", "")
          if not token:
              print("no BLOB_RW_TOKEN — skipping"); sys.exit(0)
          # List blobs under the data/ prefix
          req = urllib.request.Request(
              "https://blob.vercel-storage.com/?prefix=data/distill-corpus.jsonl&limit=1",
              headers={"Authorization": f"Bearer {token}"},
          )
          try:
              with urllib.request.urlopen(req, timeout=30) as resp:
                  data = json.loads(resp.read())
          except urllib.error.HTTPError as e:
              print(f"  list failed: {e.code} {e.reason}"); sys.exit(0)
          except Exception as e:
              print(f"  list error: {e}"); sys.exit(0)
          blobs = data.get("blobs", [])
          if not blobs:
              print("  no distill-corpus.jsonl in Blob yet — training on seed corpus only")
              sys.exit(0)
          url = blobs[0].get("downloadUrl") or blobs[0].get("url")
          if not url:
              print("  blob entry has no url — skipping"); sys.exit(0)
          try:
              with urllib.request.urlopen(url, timeout=60) as resp:
                  body = resp.read()
          except Exception as e:
              print(f"  download error: {e}"); sys.exit(0)
          with open("data/distill-corpus.jsonl", "wb") as f:
              f.write(body)
          # Count lines for visibility
          n = body.count(b"\n")
          print(f"  fetched distill-corpus.jsonl: {n} turns ({len(body):,} bytes)")
          PY

      - name: Train BPE tokenizer (if missing)
        run: |
          if [ ! -s tokenizer/tokenizer.json ]; then
            python scripts/train/tokenizer_train.py \
              --corpus scripts/data/corpus.txt \
              --vocab-size 8000 \
              --out tokenizer/tokenizer.json
          fi

      - name: Pretrain
        env:
          PYTORCH_ENABLE_MPS_FALLBACK: '1'
          MIND_VARIANT: ${{ github.event.inputs.variant || 'small' }}
        run: |
          VARIANT="${{ github.event.inputs.variant || 'small' }}"
          STEPS="${{ github.event.inputs.steps || '2000' }}"
          BATCH="${{ github.event.inputs.batch || '4' }}"
          mkdir -p checkpoints data
          HF_ARGS=""
          HF_DS="${{ github.event.inputs.hf_dataset || '' }}"
          HF_MAX="${{ github.event.inputs.hf_max_tokens || '500000' }}"
          if [ -n "$HF_DS" ]; then
            HF_ARGS="--hf-dataset $HF_DS --hf-max-tokens $HF_MAX --hf-weight 2.0"
          fi
          DISTILL_ARGS=""
          if [ -s data/distill-corpus.jsonl ]; then
            DISTILL_ARGS="--distill-corpus data/distill-corpus.jsonl"
          fi
          python scripts/train/pretrain.py \
            --variant "$VARIANT" \
            --corpus scripts/data/corpus.txt \
            --tokenizer tokenizer/tokenizer.json \
            --steps "$STEPS" \
            --batch "$BATCH" \
            --grad-accum 1 \
            --lr 3e-4 \
            --warmup 100 \
            --val-frac 0.05 \
            --val-every 200 \
            --ckpt-every 500 \
            --base-weight 1.0 \
            --distill-weight 4.0 \
            --completion-only-loss 1 \
            --persona-loss-weight 0.05 \
            $DISTILL_ARGS \
            $HF_ARGS \
            --log data/training-metrics.jsonl \
            --out checkpoints/base.bin \
            --torch-ckpt checkpoints/torch-resume.pt

      - name: Show metrics tail
        run: |
          echo "--- Last 10 training-log lines ---"
          tail -n 10 data/training-metrics.jsonl || true
          echo "--- Checkpoint size ---"
          ls -lh checkpoints/ || true

      - name: Upload checkpoint artifact
        uses: actions/upload-artifact@v4
        with:
          name: mindees-checkpoint-${{ github.run_number }}
          path: |
            checkpoints/base.bin
            tokenizer/tokenizer.json
            data/training-metrics.jsonl
          retention-days: 30
          if-no-files-found: error

      # Auto-upload the freshly trained checkpoint to Vercel Blob so the
      # next Mindees cold start hydrates the trained weights automatically.
      # Skipped if BLOB_READ_WRITE_TOKEN isn't set (forks / local-only).
      - name: Push checkpoint to Vercel Blob
        if: ${{ env.BLOB_RW_TOKEN != '' }}
        env:
          BLOB_RW_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          python - <<'PY'
          import os, sys, urllib.request, urllib.error
          token = os.environ.get("BLOB_RW_TOKEN", "")
          if not token:
              print("no BLOB_RW_TOKEN secret — skipping upload"); sys.exit(0)
          targets = [
            ("checkpoints/base.bin",        "lancedb/checkpoints/base.bin"),
            ("tokenizer/tokenizer.json",    "data/tokenizer.json"),
            ("data/training-metrics.jsonl", "data/training-metrics.jsonl"),
          ]
          uploaded = 0
          for local, blob_path in targets:
              if not os.path.exists(local):
                  print(f"  skip {local} — missing"); continue
              with open(local, "rb") as f:
                  body = f.read()
              req = urllib.request.Request(
                  f"https://blob.vercel-storage.com/{blob_path}",
                  data=body,
                  method="PUT",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "x-content-type": "application/octet-stream",
                      "x-add-random-suffix": "0",
                      "x-allow-overwrite": "1",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as resp:
                      print(f"  uploaded {local} -> {blob_path} ({resp.status})")
                      uploaded += 1
              except urllib.error.HTTPError as e:
                  print(f"  failed {local}: {e.code} {e.reason}")
          print(f"\nuploaded {uploaded}/{len(targets)} files to Vercel Blob")
          PY
