name = "mindeesai"
main = ".open-next/worker.js"
compatibility_date = "2026-05-17"
compatibility_flags = ["nodejs_compat"]

# Static assets generated by @opennextjs/cloudflare during build.
[assets]
directory = ".open-next/assets"
binding = "ASSETS"

# Cloudflare R2 binding — main app's persistence backend.
# Setup:
#   wrangler r2 bucket create mindeesai
# Or attach an existing bucket if you already have one from the Vercel
# deploy. The bucket name in `bucket_name` MUST match `R2_BUCKET` env.
[[r2_buckets]]
binding = "R2"
bucket_name = "mindeesai"

# All secrets go in the dashboard or via `wrangler secret put <NAME>`.
# Required:
#   SIDECAR_URL          — https://<user>-mindeesai-sidecar.hf.space
#   SIDECAR_AUTH_TOKEN   — shared token (also set on HF Space)
#   HF_TOKEN             — HF write-scoped token (for model checkpoint reads)
#   GROQ_API_KEY         — LLM provider
#   GEMINI_API_KEY       — LLM provider
#   ANTHROPIC_API_KEY    — LLM provider (optional)
#   OPENAI_API_KEY       — LLM provider (optional)
#   R2_ACCOUNT_ID        — required because lib/memory/persistence-r2.ts uses
#                          the SigV4 client even when the R2 binding above
#                          is present (the SigV4 path is what runs in the
#                          existing R2 backend code).
#   R2_BUCKET            — same as bucket_name above
#   R2_ACCESS_KEY_ID     — for SigV4 path
#   R2_SECRET_ACCESS_KEY — for SigV4 path
#
# Public-style envs (visible to client):
#   NEXT_PUBLIC_SITE_URL = "https://mindeesai.<your-subdomain>.workers.dev"

[vars]
MEMORY_PERSISTENCE = "cloudflare-r2"

# Cron triggers — replaces Vercel Crons + cron-job.org for the
# /api/cron/self-improve endpoint.
[triggers]
crons = ["*/30 * * * *"]
